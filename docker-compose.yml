services:
  # One-shot job that chowns every named volume to the UID:GID the owning
  # service will run as. Volumes are created root-owned on first run, and
  # the services below run as fixed non-root users (8000+), so without this
  # they would not be able to write to their own data directories.
  perms-init:
    image: alpine:3
    user: root
    command:
      - sh
      - -c
      - |
        set -e
        chown -R 8000:8000 /vol/postgres
        chown -R 8001:0 /vol/kafka
        chmod -R g+rwX /vol/kafka
        chown -R 8002:8005 /vol/tb-install
        chown -R 8002:8005 /vol/tb-logs
        chmod -R g+rwX /vol/tb-install /vol/tb-logs
    volumes:
      - postgres-data:/vol/postgres
      - kafka-data:/vol/kafka
      - thingsboard-install:/vol/tb-install
      - thingsboard-logs:/vol/tb-logs

  postgres:
    restart: always
    image: "postgres:18"
    user: "8000:8000"
    depends_on:
      perms-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tb-internal

  kafka:
    restart: always
    image: bitnamilegacy/kafka:4.0
    # gid 0 (root group) is required, not an arbitrary group: Bitnami images
    # only pre-grant write access to internal image dirs (e.g.
    # /opt/bitnami/kafka/config) to group 0, per their "arbitrary UID" support.
    user: "8001:0"
    depends_on:
      perms-init:
        condition: service_completed_successfully
    environment:
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CFG_LOG_RETENTION_MS: "300000"
      KAFKA_CFG_SEGMENT_BYTES: "26214400"
    volumes:
      - kafka-data:/bitnami
    networks:
      - tb-internal

  thingsboard-init:
    restart: on-failure
    image: "thingsboard/tb-node:4.3.1.3"
    # perms-init chowns /data and the shared log volume to 8002:8005 up
    # front, so this no longer needs to run as root to write the install
    # marker. thingsboard-ce shares group 8005 for the log volume.
    user: "8002:8005"
    depends_on:
      perms-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        set -e
        if [ -f /data/.thingsboard-installed ]; then
          echo "ThingsBoard database already initialized."
          exit 0
        fi
        INSTALL_TB=true LOAD_DEMO=$${LOAD_DEMO:-false} start-tb-node.sh
        touch /data/.thingsboard-installed
    environment:
      TB_SERVICE_ID: tb-ce-node
      TB_QUEUE_TYPE: in-memory
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      LOAD_DEMO: ${LOAD_DEMO}
    volumes:
      - thingsboard-install:/data
      - thingsboard-logs:/var/log/thingsboard
    networks:
      - tb-internal

  thingsboard-ce:
    restart: always
    image: "thingsboard/tb-node:4.3.1.3"
    user: "8003:8005"
    expose:
      - "8080"
      - "1883"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    environment:
      TB_SERVICE_ID: tb-ce-node
      JAVA_OPTS: ${JAVA_OPTS}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SECURITY_CORS_ALLOWED_ORIGINS: ${SECURITY_CORS_ALLOWED_ORIGINS}
      TB_QUEUE_TYPE: kafka
      TB_KAFKA_SERVERS: kafka:9092
    volumes:
      - thingsboard-logs:/var/log/thingsboard
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    depends_on:
      perms-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      thingsboard-init:
        condition: service_completed_successfully
    networks:
      - dokploy-network
      - tb-internal
    labels:
      - "traefik.enable=true"

      # --- Dashboard (HTTPS, standard Traefik web entrypoints) ---
      - "traefik.http.routers.thingsboard-dashboard.rule=Host(`${DASHBOARD_DOMAIN}`)"
      - "traefik.http.routers.thingsboard-dashboard.entrypoints=websecure"
      - "traefik.http.routers.thingsboard-dashboard.tls=true"
      - "traefik.http.routers.thingsboard-dashboard.tls.certresolver=${TRAEFIK_CERT_RESOLVER}"
      - "traefik.http.services.thingsboard-dashboard.loadbalancer.server.port=8080"
      # Redirect plain HTTP -> HTTPS
      - "traefik.http.routers.thingsboard-dashboard-insecure.rule=Host(`${DASHBOARD_DOMAIN}`)"
      - "traefik.http.routers.thingsboard-dashboard-insecure.entrypoints=web"
      - "traefik.http.routers.thingsboard-dashboard-insecure.middlewares=thingsboard-https-redirect"
      - "traefik.http.middlewares.thingsboard-https-redirect.redirectscheme.scheme=https"

      # --- MQTT over TLS (MQTTS). Requires a custom TCP entrypoint on
      # Traefik's static config, e.g. "mqtts" bound to host port 8883.
      # This must be added once in Dokploy's Traefik settings - see README. ---
      - "traefik.tcp.routers.thingsboard-mqtt.rule=HostSNI(`${MQTT_DOMAIN}`)"
      - "traefik.tcp.routers.thingsboard-mqtt.entrypoints=mqtts"
      - "traefik.tcp.routers.thingsboard-mqtt.tls=true"
      - "traefik.tcp.routers.thingsboard-mqtt.tls.certresolver=${TRAEFIK_CERT_RESOLVER}"
      - "traefik.tcp.services.thingsboard-mqtt.loadbalancer.server.port=1883"

networks:
  dokploy-network:
    external: true
  tb-internal:
    driver: bridge
    internal: true

volumes:
  postgres-data:
    name: tb-postgres-data
    driver: local
  kafka-data:
    name: tb-ce-kafka-data
    driver: local
  thingsboard-install:
    name: tb-ce-install-marker
    driver: local
  thingsboard-logs:
    name: tb-ce-logs
    driver: local
