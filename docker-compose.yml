# Deploy this file in Dokploy as a **Stack** (compose type "Stack"), not as
# "Docker Compose". Every service is then a Swarm service, so Swarm owns IP
# allocation on the (overlay) dokploy-network and restarts tasks after a
# reboot. Mixing plain compose containers with that overlay makes them fail to
# start after a reboot (https://github.com/Dokploy/dokploy/issues/5397).
#
# Swarm has no depends_on / pre_start, so:
#   - one-shot work is done by `replicated-job` services (run once per deploy,
#     never re-run on reboot);
#   - ordering is done by wait loops, plus Swarm restarting failed tasks.

x-restart: &restart
  restart_policy:
    condition: any
    delay: 5s

x-job: &job
  mode: replicated-job
  restart_policy:
    condition: on-failure
    delay: 5s

x-tb-env: &tb-env
  TB_SERVICE_ID: tb-ce-node
  JAVA_OPTS: ${JAVA_OPTS}
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
  SECURITY_CORS_ALLOWED_ORIGINS: ${SECURITY_CORS_ALLOWED_ORIGINS}
  TB_QUEUE_TYPE: kafka
  TB_KAFKA_SERVERS: kafka:9092
  LOAD_DEMO: ${LOAD_DEMO}

services:
  # Volumes are created root-owned and the services run as fixed non-root
  # users (8000+), so this job fixes ownership. Services that start before it
  # finishes fail and are restarted by Swarm until it has run.
  volume-init:
    image: alpine:3
    user: root
    command:
      - sh
      - -c
      - |
        set -e
        chown -R 8000:8000 /v/postgres
        # gid 0 (root group) is required for Bitnami's arbitrary-UID support.
        chown -R 8001:0 /v/kafka
        chmod -R g+rwX /v/kafka
        # thingsboard-ce runs as 8003:8005 and shares group 8005.
        chown -R 8002:8005 /v/tb-install /v/tb-logs
        chmod -R g+rwX /v/tb-install /v/tb-logs
    volumes:
      - postgres-data:/v/postgres
      - kafka-data:/v/kafka
      - thingsboard-install:/v/tb-install
      - thingsboard-logs:/v/tb-logs
    deploy:
      <<: *job

  postgres:
    image: "postgres:18"
    user: "8000:8000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tb-internal
    deploy:
      <<: *restart

  kafka:
    image: bitnamilegacy/kafka:4.0
    # gid 0 (root group) is required, not an arbitrary group: Bitnami images
    # only pre-grant write access to internal image dirs (e.g.
    # /opt/bitnami/kafka/config) to group 0, per their "arbitrary UID" support.
    user: "8001:0"
    environment:
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # localhost, not the service name: with a healthcheck, Swarm only publishes
      # the service DNS name once the task is healthy, but Kafka needs to reach
      # its own controller to become healthy (deadlock).
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@localhost:9093"
      KAFKA_CFG_LOG_RETENTION_MS: "300000"
      KAFKA_CFG_SEGMENT_BYTES: "26214400"
    volumes:
      - kafka-data:/bitnami
    # The broker listener only opens once Kafka is up (same TCP check as
    # thingsboard-ce; much lighter than spawning a JVM client every interval).
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/9092'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - tb-internal
    deploy:
      <<: *restart

  # Runs the ThingsBoard installer once per deploy. The marker file makes it
  # idempotent, so re-deploys never re-run it against an initialized database.
  # Set LOAD_DEMO=true before the *first* deploy to seed demo data.
  thingsboard-install:
    image: "thingsboard/tb-node:4.3.1.3"
    user: "8002:8005"
    environment:
      <<: *tb-env
      TB_QUEUE_TYPE: in-memory
      JAVA_OPTS: ""
    command:
      - bash
      - -c
      - |
        set -e
        if [ -f /data/.thingsboard-installed ]; then
          echo "ThingsBoard database already initialized."
          exit 0
        fi
        # Wait for volume-init (ownership) and for Postgres to accept connections.
        until touch /data/.w 2>/dev/null; do sleep 2; done
        rm -f /data/.w
        until (echo > /dev/tcp/postgres/5432) 2>/dev/null; do sleep 3; done
        INSTALL_TB=true LOAD_DEMO=$${LOAD_DEMO:-false} start-tb-node.sh
        touch /data/.thingsboard-installed
    volumes:
      - thingsboard-install:/data
    networks:
      - tb-internal
    deploy:
      <<: *job

  thingsboard-ce:
    image: "thingsboard/tb-node:4.3.1.3"
    user: "8003:8005"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    environment:
      <<: *tb-env
    # Wait for the installer's marker instead of depends_on. Swarm restarts
    # the task if Postgres/Kafka are not ready yet.
    command:
      - bash
      - -c
      - |
        until [ -f /data/.thingsboard-installed ]; do
          echo "Waiting for ThingsBoard installer..."
          sleep 5
        done
        exec start-tb-node.sh
    volumes:
      - thingsboard-install:/data:ro
      - thingsboard-logs:/var/log/thingsboard
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    networks:
      - dokploy-network
      - tb-internal
    deploy:
      <<: *restart
      # In Swarm mode Traefik reads labels from the service (deploy.labels).
      labels:
        - "traefik.enable=true"
        # Two networks are attached; tell Traefik which one to use.
        - "traefik.docker.network=dokploy-network"

        # --- Dashboard (HTTPS, standard Traefik web entrypoints) ---
        - "traefik.http.routers.thingsboard-dashboard.rule=Host(`${DASHBOARD_DOMAIN}`)"
        - "traefik.http.routers.thingsboard-dashboard.entrypoints=websecure"
        - "traefik.http.routers.thingsboard-dashboard.tls=true"
        - "traefik.http.routers.thingsboard-dashboard.tls.certresolver=${TRAEFIK_CERT_RESOLVER}"
        - "traefik.http.routers.thingsboard-dashboard.service=thingsboard-dashboard"
        - "traefik.http.services.thingsboard-dashboard.loadbalancer.server.port=8080"
        # Redirect plain HTTP -> HTTPS
        - "traefik.http.routers.thingsboard-dashboard-insecure.rule=Host(`${DASHBOARD_DOMAIN}`)"
        - "traefik.http.routers.thingsboard-dashboard-insecure.entrypoints=web"
        - "traefik.http.routers.thingsboard-dashboard-insecure.middlewares=thingsboard-https-redirect"
        - "traefik.http.routers.thingsboard-dashboard-insecure.service=thingsboard-dashboard"
        - "traefik.http.middlewares.thingsboard-https-redirect.redirectscheme.scheme=https"

        # --- MQTT over TLS (MQTTS). Requires a custom TCP entrypoint on
        # Traefik's static config, e.g. "mqtts" bound to host port 8883.
        # This must be added once in Dokploy's Traefik settings - see README. ---
        - "traefik.tcp.routers.thingsboard-mqtt.rule=HostSNI(`${MQTT_DOMAIN}`)"
        - "traefik.tcp.routers.thingsboard-mqtt.entrypoints=mqtts"
        - "traefik.tcp.routers.thingsboard-mqtt.tls=true"
        - "traefik.tcp.routers.thingsboard-mqtt.tls.certresolver=${TRAEFIK_CERT_RESOLVER}"
        - "traefik.tcp.routers.thingsboard-mqtt.service=thingsboard-mqtt"
        - "traefik.tcp.services.thingsboard-mqtt.loadbalancer.server.port=1883"

networks:
  dokploy-network:
    external: true
  tb-internal:
    driver: overlay
    internal: true

volumes:
  postgres-data:
    name: tb-postgres-data
    driver: local
  kafka-data:
    name: tb-ce-kafka-data
    driver: local
  thingsboard-install:
    name: tb-ce-install-marker
    driver: local
  thingsboard-logs:
    name: tb-ce-logs
    driver: local
